name: Build Split View Pro deb

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deb (roothide + rootless)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide/theos
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "Theos install attempt $attempt ..."
            if bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"; then
              break
            fi
            sleep 20
          done
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          set -e
          echo "THEOS=$THEOS"
          ls -la "$THEOS" | head
          xcodebuild -version
          clang --version

      - name: Build roothide package
        env:
          THEOS_PACKAGE_SCHEME: roothide
          BUILD_PREFS: 0
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1
          mkdir -p artifacts
          cp packages/*.deb artifacts/ 2>/dev/null || true
          ls -lh packages/ artifacts/

      - name: Build rootless package
        env:
          THEOS_PACKAGE_SCHEME: rootless
          BUILD_PREFS: 0
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1
          cp packages/*.deb artifacts/ 2>/dev/null || true
          ls -lh packages/ artifacts/

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: SplitViewPro-debs
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30
